apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrations
  namespace: bibliotec
  labels:
    app: bibliotec-web
    job: migrations
spec:
  template:
    metadata:
      labels:
        app: bibliotec-web
        job: migrations
    spec:
      restartPolicy: OnFailure
      
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
      
      containers:
      - name: migrate
        image: bibliotec-web:latest
        imagePullPolicy: IfNotPresent
        
        command: ["python", "manage.py", "migrate", "--noinput"]
        
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: bibliotec-config
              key: DEBUG
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bibliotec-secrets
              key: DJANGO_SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bibliotec-secrets
              key: DATABASE_URL
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"


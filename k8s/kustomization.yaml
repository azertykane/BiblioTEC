apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bibliotec

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - django-pvc.yaml
  - django-deployment.yaml
  - django-service.yaml
  - nginx-configmap.yaml
  - nginx-deployment.yaml
  - nginx-service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  project: bibliotec
  managed-by: kustomize


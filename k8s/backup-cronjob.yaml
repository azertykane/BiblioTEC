apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: bibliotec
  labels:
    app: postgres
    job: backup
spec:
  schedule: "0 2 * * *"  # Tous les jours à 2h du matin
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          
          containers:
          - name: backup
            image: postgres:16-alpine
            
            command:
            - /bin/sh
            - -c
            - |
              BACKUP_FILE="/backups/backup_$(date +%Y%m%d_%H%M%S).sql"
              pg_dump -h postgres-service -U $POSTGRES_USER $POSTGRES_DB > $BACKUP_FILE
              echo "Backup créé: $BACKUP_FILE"
              
              # Garder seulement les 30 derniers backups
              ls -t /backups/*.sql | tail -n +31 | xargs -r rm
            
            env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bibliotec-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bibliotec-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliotec-secrets
                  key: POSTGRES_PASSWORD
            
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: bibliotec
  labels:
    app: postgres
    type: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard

